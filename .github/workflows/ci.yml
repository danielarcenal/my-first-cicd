name: Playwright BDD Website Tests

on: [push]

jobs:
  playwright-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install dependencies
      run: npm install

    # FIX: Run the browser installation directly using the local node module binary pathway
    - name: Install Playwright Browsers
      run: ./node_modules/.bin/playwright install --with-deps

    # FIX: Run the tests directly using your package.json test script definitions
    - name: Run Playwright BDD tests
      run: npm test

